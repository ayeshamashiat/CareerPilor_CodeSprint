events {
    worker_connections 1024;
}

http {
    # ── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=10r/s;
    limit_req_zone $binary_remote_addr zone=heavy_limit:10m  rate=2r/s;

    # ── Load balancing — least connections across 3 FastAPI instances ────────
    upstream careerpilot_backend {
        least_conn;
        server backend1:8000;
        server backend2:8000;
        server backend3:8000;
    }

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" $status rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;

        client_max_body_size 10M;

        # Shared proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # ── Heavy endpoints — strict rate limit (2 req/s, burst 5) ──────────
        location ~ ^/api/(jobs/search|tailor/cv|interview/start|interview/answer|fit/score) {
            limit_req zone=heavy_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://careerpilot_backend;
        }

        # ── Auth endpoints ───────────────────────────────────────────────────
        location ~ ^/api/auth/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://careerpilot_backend;
        }

        # ── All other API endpoints ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://careerpilot_backend;
        }

        # ── Health check (no rate limit) ─────────────────────────────────────
        location /health {
            proxy_pass http://careerpilot_backend;
        }

        # ── Frontend (React dev server on host machine) ───────────────────────
        location / {
            proxy_pass http://host.docker.internal:5173;
            proxy_set_header Host $host;
        }

        # ── 429 JSON response ────────────────────────────────────────────────
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"detail": "Too many requests. Please slow down."}';
        }
    }
}