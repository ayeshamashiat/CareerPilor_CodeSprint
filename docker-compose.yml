version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3

  backend1:
    build: ./backend
    volumes:
      - chroma_data:/app/chroma_store
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis

  backend2:
    build: ./backend
    volumes:
      - chroma_data:/app/chroma_store
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis

  backend3:
    build: ./backend
    volumes:
      - chroma_data:/app/chroma_store
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  chroma_data: