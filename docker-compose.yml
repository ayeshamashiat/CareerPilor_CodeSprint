services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3

  backend1:
    build: ./backend
    volumes:
      - chroma_data:/app/chroma_store
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_PERSIST_PATH=/app/chroma_store
    dns:
      - 8.8.8.8
      - 8.8.4.4

  backend2:
    build: ./backend
    volumes:
      - chroma_data:/app/chroma_store
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_PERSIST_PATH=/app/chroma_store
    dns:
      - 8.8.8.8
      - 8.8.4.4

  backend3:
    build: ./backend
    volumes:
      - chroma_data:/app/chroma_store
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_PERSIST_PATH=/app/chroma_store
    dns:
      - 8.8.8.8
      - 8.8.4.4

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  chroma_data: